name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式检查：与平台无关，跑一次即可
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # 三平台矩阵：clippy + test + build
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Linux 下 eframe/winit/glow 需要 X11、Wayland、OpenGL 等开发库
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build (debug)
        run: cargo build

  # 三平台分别产出优化后的发布版二进制作为构建产物
  release:
    name: release (${{ matrix.os }})
    needs: [fmt, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 推 v* tag 时创建 GitHub Release 并上传二进制
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mowerhud-linux
            bin: target/release/mowerhud
            asset: mowerhud-linux
          - os: windows-latest
            artifact: mowerhud-windows
            bin: target/release/mowerhud.exe
            asset: mowerhud-windows.exe
          - os: macos-latest
            artifact: mowerhud-macos
            bin: target/release/mowerhud
            asset: mowerhud-macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      # 仅当推送 v* tag 时：把本平台二进制改成带平台名的文件，发布到该 tag 的 GitHub Release。
      # 三个平台的 job 各自把自己的产物上传到同一个 Release（softprops 会合并）。
      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
          # 仅让一个平台生成发布说明，否则三个并发 job 各生成一次会重复
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
